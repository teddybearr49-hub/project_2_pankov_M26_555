[project]
name = "primitive-db"
version = "0.1.0"
description = "Console database with CRUD operations, decorators and caching"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Панков", email = "teddy.bearr49@gmail.com" },
]
dependencies = [
    "prettytable>=3.10",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []